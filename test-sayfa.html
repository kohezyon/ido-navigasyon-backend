<!DOCTYPE html>
<html>
<head>
    <title>Baglanti Testi</title>
</head>
<body>
    <h1>Baglanti Durumu:</h1>
    <p id="durum">Baglaniyor...</p>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const soket = io('http://localhost:3000');

        soket.on('connect', () => {
            document.getElementById('durum').innerText = 'BAGLANDI! ID: ' + soket.id;
            document.getElementById('durum').style.color = 'green';
        });

        soket.on('disconnect', () => {
            document.getElementById('durum').innerText = 'Baglanti kesildi';
            document.getElementById('durum').style.color = 'red';
        });
    </script>
</body>
</html>
