<!DOCTYPE html>
<html>
<head>
    <title>Personel Paneli</title>
</head>
<body style="font-family: Arial; text-align: center; padding-top: 60px;">
    <h1>Personel Acil Durum Paneli</h1>

    <div style="margin-bottom: 20px; padding: 10px; background: #eee; display: inline-block;">
        <strong>Baglanti durumu:</strong> <span id="baglanti-durumu">kontrol ediliyor...</span>
    </div>

    <div>
        <strong>Durum:</strong> <span id="acil-durum-durumu" style="font-weight: bold; color: green;">NORMAL</span>
    </div>

    <div style="margin-top: 30px;">
        <button id="acilButon" style="font-size: 24px; background-color: red; color: white; padding: 20px 40px; border: none; border-radius: 10px; cursor: pointer;">
            ACIL DURUM BASLAT
        </button>

        <button id="bitirButon" style="font-size: 24px; background-color: gray; color: white; padding: 20px 40px; border: none; border-radius: 10px; cursor: pointer; margin-left: 20px;" disabled>
            ACIL DURUMU BITIR
        </button>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const soket = io('http://localhost:3000');

        soket.on('connect', () => {
            document.getElementById('baglanti-durumu').innerText = 'BAGLI (' + soket.id + ')';
            document.getElementById('baglanti-durumu').style.color = 'green';
        });

        soket.on('disconnect', () => {
            document.getElementById('baglanti-durumu').innerText = 'BAGLANTI KESILDI';
            document.getElementById('baglanti-durumu').style.color = 'red';
        });

        document.getElementById('acilButon').addEventListener('click', () => {
            const eminMi = confirm('ACIL DURUM baslatmak istediginizden emin misiniz?');

            if (eminMi) {
                soket.emit('acil-durum-baslat', {
                    gemi_adi: 'Yalova Feribotu 1'
                });

                document.getElementById('acil-durum-durumu').innerText = 'AKTIF ACIL DURUM VAR';
                document.getElementById('acil-durum-durumu').style.color = 'red';

                document.getElementById('acilButon').disabled = true;
                document.getElementById('bitirButon').disabled = false;
                document.getElementById('bitirButon').style.backgroundColor = 'green';
            }
        });

        document.getElementById('bitirButon').addEventListener('click', () => {
            const eminMi = confirm('Acil durumu bitirmek istediginizden emin misiniz?');

            if (eminMi) {
                soket.emit('acil-durum-bitir', {
                    gemi_adi: 'Yalova Feribotu 1'
                });

                document.getElementById('acil-durum-durumu').innerText = 'NORMAL';
                document.getElementById('acil-durum-durumu').style.color = 'green';

                document.getElementById('acilButon').disabled = false;
                document.getElementById('bitirButon').disabled = true;
                document.getElementById('bitirButon').style.backgroundColor = 'gray';
            }
        });
    </script>
</body>
</html>
