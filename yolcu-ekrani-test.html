<!DOCTYPE html>
<html>
<head>
    <title>Yolcu Ekrani</title>
</head>
<body id="govde" style="font-family: Arial; text-align: center; padding-top: 60px; margin: 0; min-height: 100vh;">
    <h1 id="baslik">Yolculuk devam ediyor</h1>
    <p id="detay">Her sey normal</p>

    <div style="margin-top: 10px; padding: 10px; background: #eee; display: inline-block;">
        <strong>Baglanti durumu:</strong> <span id="baglanti-durumu">kontrol ediliyor...</span>
    </div>

    <div style="margin-top: 30px;">
        <h3>Gemi Konumu (canli):</h3>
        <p id="konum">Bekleniyor...</p>

        <h3>Yakinlik Durumu:</h3>
        <p id="yakinlik">Herhangi bir noktaya yakin degil</p>
    </div>

    <!-- BILGI KARTI: hem ada hem batik icin kullanilacak, renk tipe gore degisecek -->
    <div id="bilgi-karti" style="display: none; margin: 30px auto; max-width: 500px; border-radius: 15px; padding: 20px; text-align: left;">
        <h2 id="kart-baslik"></h2>
        <p id="kart-aciklama"></p>
        <a id="kart-video-link" href="#" target="_blank" style="display: inline-block; margin-top: 10px; padding: 10px 20px; color: white; text-decoration: none; border-radius: 8px;">
            Isaret Dili Videosunu Ac
        </a>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const soket = io('http://localhost:3000');

        soket.on('connect', () => {
            document.getElementById('baglanti-durumu').innerText = 'BAGLI (' + soket.id + ')';
            document.getElementById('baglanti-durumu').style.color = 'green';
        });

        soket.on('connect_error', (hata) => {
            document.getElementById('baglanti-durumu').innerText = 'HATA: ' + hata.message;
            document.getElementById('baglanti-durumu').style.color = 'red';
        });

        soket.on('disconnect', () => {
            document.getElementById('baglanti-durumu').innerText = 'BAGLANTI KESILDI';
            document.getElementById('baglanti-durumu').style.color = 'red';
        });

        // Her tipe gore farkli renk secen yardimci fonksiyon
        function tipRengi(tip) {
            if (tip === 'ada') return { arkaplan: '#fff8e1', kenar: 'orange', buton: '#e65100' };
            if (tip === 'batik') return { arkaplan: '#e3f2fd', kenar: '#1565c0', buton: '#1565c0' };
            return { arkaplan: '#f5f5f5', kenar: '#666', buton: '#666' };
        }

        soket.on('gemi-konum-guncelleme', (veri) => {
            document.getElementById('konum').innerText =
                'Enlem: ' + veri.enlem.toFixed(4) + ' / Boylam: ' + veri.boylam.toFixed(4);

            const kartElementi = document.getElementById('bilgi-karti');

            if (veri.tetiklenen_noktalar.length > 0) {
                const isimler = veri.tetiklenen_noktalar.map(n => n.nokta_adi + ' (' + n.mesafe_metre + 'm)');
                document.getElementById('yakinlik').innerText = 'YAKLASILDI: ' + isimler.join(', ');
                document.getElementById('yakinlik').style.color = 'orange';
                document.getElementById('yakinlik').style.fontWeight = 'bold';

                // Artik "ada" VEYA "batik" olan ilk noktayi ariyoruz
                const gosterilecekNokta = veri.tetiklenen_noktalar.find(
                    n => n.tip === 'ada' || n.tip === 'batik'
                );

                if (gosterilecekNokta) {
                    const renkler = tipRengi(gosterilecekNokta.tip);

                    document.getElementById('kart-baslik').innerText = gosterilecekNokta.nokta_adi;
                    document.getElementById('kart-baslik').style.color = renkler.buton;
                    document.getElementById('kart-aciklama').innerText = gosterilecekNokta.aciklama;
                    document.getElementById('kart-video-link').href = gosterilecekNokta.video_url;
                    document.getElementById('kart-video-link').style.backgroundColor = renkler.buton;

                    kartElementi.style.backgroundColor = renkler.arkaplan;
                    kartElementi.style.border = '3px solid ' + renkler.kenar;
                    kartElementi.style.display = 'block';
                } else {
                    kartElementi.style.display = 'none';
                }
            } else {
                document.getElementById('yakinlik').innerText = 'Herhangi bir noktaya yakin degil';
                document.getElementById('yakinlik').style.color = 'black';
                document.getElementById('yakinlik').style.fontWeight = 'normal';
                kartElementi.style.display = 'none';
            }
        });

        soket.on('acil-durum-uyarisi', (veri) => {
            document.getElementById('govde').style.backgroundColor = 'red';
            document.getElementById('govde').style.color = 'white';
            document.getElementById('baslik').innerText = 'ACIL DURUM!';
            document.getElementById('detay').innerText = veri.mesaj + ' (Gemi: ' + veri.gemi + ')';
            if (navigator.vibrate) {
                navigator.vibrate([500, 200, 500, 200, 500, 200, 500]);
            }
        });
soket.on('acil-durum-bitti', (veri) => {
    document.getElementById('govde').style.backgroundColor = '';
    document.getElementById('govde').style.color = '';
    document.getElementById('baslik').innerText = 'Yolculuk devam ediyor';
    document.getElementById('detay').innerText = veri.mesaj;
});
    </script>
</body>
</html>
